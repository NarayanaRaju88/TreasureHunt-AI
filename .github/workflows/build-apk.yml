name: Build Flutter APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - name: Flutter Version
        run: flutter --version

      - name: Clean Flutter
        run: |
          flutter clean
          flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Print release signing SHA-1
        run: |
          keytool -list -v \
            -keystore android/keystore/aitreasurehunt-upload.jks \
            -alias aitreasurehunt \
            -storepass android \
            -keypass android | tee sha-fingerprints.txt
          echo ""
          echo "Add the SHA1 value above to Firebase → Project settings → Your apps → Add fingerprint"
          echo "Then re-download google-services.json"

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }} \
            --dart-define=GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Treasure-Hunt-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload SHA fingerprints
        uses: actions/upload-artifact@v4
        with:
          name: signing-sha-fingerprints
          path: sha-fingerprints.txt
